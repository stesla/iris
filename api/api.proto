import "google/protobuf/empty.proto";

option go_package = "github.com/stesla/iris/api";

service Upstreams {
  rpc AddUpstream (AddUpstreamRequest) returns (google.protobuf.Empty) {}
  rpc ListUpstreams (google.protobuf.Empty) returns (ListUpstreamResponse) {}
}

message AddUpstreamRequest {
  required string name = 1;
  required string address = 2;
  required string password = 3;
  required string script = 4;
}

message ListUpstreamResponse {
  repeated string upstreams = 1;
}
